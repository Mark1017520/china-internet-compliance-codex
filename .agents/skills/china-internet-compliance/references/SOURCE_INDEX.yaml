version: V1.0.2
last_verified: 2026-06-04
purpose: >
  Static official-source index for citation guardrails. This index is a
  starting point for compliance triage and working papers. Always verify the
  latest official text before final legal reliance.

source_status:
  official_current: Official text or official release page reviewed for this index.
  official_high_change: Official source reviewed, but topic changes frequently.
  official_future_effective: Official source published but not yet effective as of last_verified.
  needs_local_profile: Must be combined with company policy, product facts, or local legal review.

